name: Deploy to Domainesia VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Domainesia VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            # 1. Setup Environment Paths
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
            
            # Safely source profiles without exiting on non-zero
            if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc" 2>/dev/null || true; fi
            if [ -f "$HOME/.profile" ]; then . "$HOME/.profile" 2>/dev/null || true; fi
            if [ -f "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh" 2>/dev/null || true; fi

            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/root/kmi-compro-site' }}"
            REPO_URL="https://github.com/tikkunakusa/kmi-compro-site.git"

            echo "🚀 Starting Deployment on Domainesia VPS..."
            echo "📂 Target Directory: $TARGET_DIR"

            # 2. Check or Clone Repository
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📂 Directory $TARGET_DIR does not exist. Cloning repository..."
              git clone "$REPO_URL" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # Ensure git safe directory
            git config --global --add safe.directory "$TARGET_DIR" || true

            echo "🔍 Environment Info:"
            echo "Node: $(node -v 2>/dev/null || echo 'Not Found')"
            echo "NPM: $(npm -v 2>/dev/null || echo 'Not Found')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'Not Found')"
            echo "Current Dir: $(pwd)"

            # 3. Pull latest code
            echo "📥 Fetching and syncing code from branch main..."
            git fetch origin main
            git reset --hard origin/main

            # 4. Install dependencies
            echo "📦 Installing npm dependencies..."
            npm install --legacy-peer-deps

            # 5. Build Next.js
            echo "🏗️ Building Next.js Standalone..."
            npm run build

            # 6. Prepare Standalone static files
            echo "📁 Copying static and public assets for standalone server..."
            mkdir -p .next/standalone/.next
            cp -R .next/static .next/standalone/.next/
            cp -R public .next/standalone/

            # 7. Restart or start PM2 process
            echo "🔄 Managing PM2 process..."
            if pm2 describe kmi-compro-site > /dev/null 2>&1; then
              echo "Restarting existing PM2 process 'kmi-compro-site'..."
              pm2 restart kmi-compro-site --update-env
            else
              echo "Starting new PM2 process 'kmi-compro-site'..."
              if [ -f "ecosystem.config.cjs" ]; then
                pm2 start ecosystem.config.cjs
              elif [ -f "docs/deployment/configs/ecosystem.config.js" ]; then
                pm2 start docs/deployment/configs/ecosystem.config.js
              else
                pm2 start "node .next/standalone/server.js" --name "kmi-compro-site"
              fi
            fi

            pm2 save

            echo "========================================="
            echo "🎉 Deployment completed successfully!"
            echo "========================================="
