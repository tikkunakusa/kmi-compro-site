###########################################################
# HTTP
###########################################################

server {

    listen 80;
    listen [::]:80;

    server_name
        konsultanmanajemenindonesia.com
        www.konsultanmanajemenindonesia.com;

    return 301 https://konsultanmanajemenindonesia.com$request_uri;
}

###########################################################
# HTTPS WWW
###########################################################

server {

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.konsultanmanajemenindonesia.com;

    ssl_certificate /etc/letsencrypt/live/konsultanmanajemenindonesia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konsultanmanajemenindonesia.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://konsultanmanajemenindonesia.com$request_uri;
}

###########################################################
# HTTPS MAIN
###########################################################

server {

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name konsultanmanajemenindonesia.com;

    ssl_certificate /etc/letsencrypt/live/konsultanmanajemenindonesia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konsultanmanajemenindonesia.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;

    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;

    location / {

        proxy_pass http://127.0.0.1:3434;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}